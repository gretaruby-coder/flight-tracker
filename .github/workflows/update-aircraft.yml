name: Update Aircraft Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aircraft-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch aircraft and flight routes
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          LAT = 51.4496
          LON = -0.4089
          RADIUS_NM = 27

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "SkyAboveMe/1.0",
                      "Accept": "application/json"
                  }
              )
              with urllib.request.urlopen(req, timeout=25) as res:
                  return json.load(res)

          url = (
              f"https://opendata.adsb.fi/api/v3/"
              f"lat/{LAT}/lon/{LON}/dist/{RADIUS_NM}"
          )

          data = get_json(url)
          aircraft = data.get("ac", [])

          # Keep only aircraft with valid positions
          # that are actually airborne.
          airborne = [
              a for a in aircraft
              if isinstance(a.get("lat"), (int, float))
              and isinstance(a.get("lon"), (int, float))
              and a.get("alt_baro") != "ground"
              and isinstance(a.get("gs"), (int, float))
              and a["gs"] > 0
              and a.get("r") not in ("GND", "TWR")
          ]

          # Reuse routes from earlier successful updates.
          cache = {}
          if os.path.exists("routes-cache.json"):
              try:
                  with open("routes-cache.json") as f:
                      cache = json.load(f)
              except (OSError, ValueError):
                  cache = {}

          now = time.time()
          route_requests = 0
          aircraft_requests = 0
          MAX_ROUTE_REQUESTS = 24
          MAX_AIRCRAFT_REQUESTS = 12
          aircraft_cache = {}
          if os.path.exists('aircraft-cache.json'):
              try:
                  with open('aircraft-cache.json') as f:
                      aircraft_cache = json.load(f)
              except (OSError, ValueError):
                  aircraft_cache = {}

          for a in airborne:
              hex_code = str(a.get("hex") or "").strip().upper()
              if hex_code:
                  saved_aircraft = aircraft_cache.get(hex_code)
                  info = None
                  if isinstance(saved_aircraft, dict) and now - saved_aircraft.get("time", 0) < 604800:
                      info = saved_aircraft.get("aircraft")
                  elif aircraft_requests < MAX_AIRCRAFT_REQUESTS:
                      aircraft_requests += 1
                      try:
                          response = get_json("https://api.adsbdb.com/v0/aircraft/" + hex_code)
                          info = (response.get("response") or {}).get("aircraft")
                          if isinstance(info, dict):
                              aircraft_cache[hex_code] = {"time": now, "aircraft": info}
                      except Exception as e:
                          print("Aircraft lookup unavailable:", hex_code, str(e))
                      time.sleep(0.5)
                  if isinstance(info, dict):
                      a["registered_owner"] = info.get("registered_owner")
                      a["registered_owner_operator_flag_code"] = info.get("registered_owner_operator_flag_code")
                      if not a.get("r"):
                          a["r"] = info.get("registration")
                      if not a.get("desc"):
                          a["desc"] = info.get("type")

              callsign = (a.get("flight") or "").strip().upper()
              if not callsign:
                  continue

              saved = cache.get(callsign)
              route = None

              # Reuse cached results for up to 24 hours.
              if saved and now - saved.get("time", 0) < 86400:
                  route = saved.get("route")
              elif route_requests < MAX_ROUTE_REQUESTS:
                  route_requests += 1

                  try:
                      result = get_json(
                          "https://api.adsbdb.com/v0/callsign/"
                          + callsign
                      )
                      route = (
                          result.get("response", {})
                          .get("flightroute")
                      )

                      if isinstance(route, dict):
                          cache[callsign] = {
                              "time": now,
                              "route": route
                          }
                      else:
                          route = None
                          # Cache unsuccessful lookups briefly to avoid retrying every run.
                          cache[callsign] = {"time": now, "route": None}

                  except Exception as e:
                      print("Route unavailable:", callsign, str(e))

                  # Avoid rapid requests to the route API.
                  time.sleep(0.5)

              if isinstance(route, dict):
                  origin = route.get("origin") or {}
                  destination = route.get("destination") or {}
                  airline = route.get("airline") or {}

                  a["origin"] = {
                      "iata": origin.get("iata_code"),
                      "icao": origin.get("icao_code"),
                      "name": origin.get("name")
                  }
                  a["destination"] = {
                      "iata": destination.get("iata_code"),
                      "icao": destination.get("icao_code"),
                      "name": destination.get("name")
                  }
                  a["airline_name"] = airline.get("name")
                  a["airline_iata"] = airline.get("iata")

          # Remove old cache entries after 7 days.
          cache = {
              key: value for key, value in cache.items()
              if now - value.get("time", 0) < 604800
          }

          aircraft_cache = {
              key: value for key, value in aircraft_cache.items()
              if now - value.get("time", 0) < 604800
          }

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "center": {"lat": LAT, "lon": LON},
              "radius_nm": RADIUS_NM,
              "aircraft": airborne
          }

          with open("aircraft.json", "w") as f:
              json.dump(output, f, indent=2)

          with open("routes-cache.json", "w") as f:
              json.dump(cache, f, indent=2)

          with open("aircraft-cache.json", "w") as f:
              json.dump(aircraft_cache, f, indent=2)

          print("New aircraft lookups:", aircraft_requests)
          print("Airborne aircraft:", len(airborne))
          print("New route lookups:", route_requests)
          print("Saved aircraft.json and routes-cache.json")
          PY

      - name: Publish aircraft data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aircraft.json routes-cache.json aircraft-cache.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update aircraft and route data"
            git pull --rebase
            git push
          fi
