
name: Update Aircraft Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: aircraft-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch aircraft near Feltham
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          lat = 51.4496
          lon = -0.4089
          radius = 10

          url = (
              f"https://opendata.adsb.fi/api/v3/"
              f"lat/{lat}/lon/{lon}/dist/{radius}"
          )

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "SkyAboveMe/1.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "center": {"lat": lat, "lon": lon},
              "radius_nm": radius,
              "aircraft": data.get("ac", [])
          }

          with open("aircraft.json", "w") as file:
              json.dump(output, file, indent=2)

          print("Aircraft found:", len(output["aircraft"]))
          print("Saved aircraft.json")
          PY

      - name: Publish aircraft data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aircraft.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update aircraft data"
            git push
          fi
